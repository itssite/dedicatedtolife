<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dedicated to Life | High-End Personal Training Nijmegen</title>
  <meta name="description" content="Dedicated to Life is a high-end personal training studio in Nijmegen. 1:1 personal training, coaching, strength & lifestyle support. Book your VIP intake." />
  <link rel="preconnect" href="https://images.unsplash.com" />

  <style>
    :root{
      --bg:#0b0f14;
      --card:#0f1620;
      --soft:#121b27;
      --line:rgba(255,255,255,.10);
      --text:#eaf1f8;
      --muted:#9fb0c3;
      --accent:#7cf7c2;
      --accent2:#7aa7ff;
      --shadow: 0 18px 60px rgba(0,0,0,.55);
      --radius: 18px;
      --radius2: 28px;
      --max: 1160px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
      background: radial-gradient(1200px 700px at 20% 10%, rgba(122,167,255,.14), transparent 55%),
                  radial-gradient(1000px 600px at 90% 0%, rgba(124,247,194,.12), transparent 52%),
                  var(--bg);
      color:var(--text);
      line-height:1.6;
    }
    a{color:inherit}
    .container{width:100%; max-width:var(--max); margin:0 auto; padding:0 20px;}
    .topbar{
      position:sticky; top:0; z-index:50;
      backdrop-filter: blur(14px);
      background: rgba(11,15,20,.65);
      border-bottom: 1px solid var(--line);
    }
    .nav{
      display:flex; align-items:center; justify-content:space-between;
      padding:14px 0;
      gap:12px;
    }
    .brand{
      display:flex; align-items:center; gap:12px; text-decoration:none;
    }
    .logo{
      width:38px; height:38px; border-radius:12px;
      background: linear-gradient(135deg, rgba(124,247,194,.95), rgba(122,167,255,.9));
      box-shadow: 0 12px 40px rgba(124,247,194,.12);
    }
    .brand strong{letter-spacing:.5px}
    .brand small{font-size:12px;color:var(--muted)}
    .navlinks{
      display:flex; gap:18px; align-items:center;
      color: var(--muted);
      font-size:14px;
    }
    .navlinks a{ text-decoration:none; padding:8px 10px; border-radius:10px;}
    .navlinks a:hover{ background: rgba(255,255,255,.06); color:var(--text);}
    .cta{ display:flex; gap:10px; align-items:center; }
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      padding:11px 14px;
      border-radius:12px;
      border:1px solid var(--line);
      background: rgba(255,255,255,.04);
      text-decoration:none;
      color:var(--text);
      font-weight:700;
      font-size:14px;
      transition: .2s ease;
      white-space:nowrap;
    }
    .btn:hover{ transform: translateY(-1px); background: rgba(255,255,255,.07); }
    .btn.primary{
      border: 1px solid rgba(124,247,194,.32);
      background: linear-gradient(135deg, rgba(124,247,194,.18), rgba(122,167,255,.14));
    }

    header.hero{ padding: 58px 0 30px; }
    .hero-grid{
      display:grid;
      grid-template-columns: 1.1fr .9fr;
      gap: 26px;
      align-items:stretch;
    }
    .hero-card{
      background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
      border:1px solid var(--line);
      border-radius: var(--radius2);
      box-shadow: var(--shadow);
      overflow:hidden;
      position:relative;
    }
    .hero-content{ padding: 34px; }
    h1{
      margin:16px 0 12px;
      font-size: 44px;
      line-height: 1.08;
      letter-spacing: -0.6px;
    }

    @media (max-width: 980px){
      .hero-grid{ grid-template-columns:1fr; }
      h1{ font-size: 36px; }
      .navlinks{ display:none; }
    }
  </style>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GHNVPC5CSV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-GHNVPC5CSV');
  </script>

  <!-- Schema: LocalBusiness -->
  <script type="application/ld+json">
  {
    "@context":"https://schema.org",
    "@type":"HealthAndBeautyBusiness",
    "name":"Dedicated to Life",
    "url":"https://dedicatedtolife.nl/",
    "telephone":"+31643501521",
    "address":{
      "@type":"PostalAddress",
      "streetAddress":"Distributieweg 11",
      "postalCode":"6541 DR",
      "addressLocality":"Nijmegen",
      "addressCountry":"NL"
    }
  }
  </script>
</head>

<body>
  <div class="topbar">
    <div class="container">
      <div class="nav">
        <a class="brand" href="#top">
          <span class="logo"></span>
          <div>
            <strong>Dedicated to Life</strong><br />
            <small>High-End Personal Training Studio • Nijmegen</small>
          </div>
        </a>
      </div>
    </div>
  </div>

  <header class="hero" id="top">
    <div class="container">
      <h1>Private, high-end personal training in Nijmegen—made for real life.</h1>
    </div>
  </header>

  <script>
    document.getElementById("year")?.textContent = new Date().getFullYear();
  </script>
</body>
</html>
